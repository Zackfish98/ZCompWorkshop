<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Can I Scoot To This? — Two Step Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;1,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* Same palette + fonts as the main site's css/styles.css, kept local
     here since this page lives outside that stylesheet's reach */
  :root {
    --bg: #f8f3e8;
    --ink: #191919;
    --ink-soft: rgba(25, 25, 25, 0.62);
    --coral: #e16e57;
    --chartreuse: #e2e88c;
    --seafoam: #a3c7c5;
    --blue: #2e72a4;
    --pink: #d66577;
    --orange: #f4a556;
    --serif: 'Bitter', Georgia, serif;
    --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .back-link {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--ink);
    color: var(--bg);
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    border: 2px solid var(--ink);
  }
  .back-link span { color: var(--chartreuse); }
  .container {
    background: #fffdfa;
    border: 2px solid var(--ink);
    border-radius: 16px;
    padding: 2.5rem;
    margin-top: 1.5rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-style: italic;
    font-size: 1.9rem;
    margin: 0 0 0.5rem;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 0 0 1.5rem;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--sans);
    font-size: 1rem;
    padding: 0.65rem 0.8rem;
    border: 2px solid var(--ink-soft);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    margin-bottom: 0.75rem;
  }
  input:focus {
    outline: none;
    border-color: var(--coral);
  }
  button {
    width: 100%;
    background: var(--ink);
    color: var(--bg);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 0.75rem 2rem;
    font-family: var(--sans);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  button:hover {
    background: var(--coral);
    border-color: var(--coral);
    color: var(--ink);
  }
  #output {
    margin-top: 1.25rem;
    text-align: left;
    white-space: pre-wrap;
    background: var(--bg);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 1rem;
    min-height: 1.5em;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .community-link {
    display: inline-block;
    margin-top: 1.25rem;
    font-size: 0.85rem;
    color: var(--blue);
  }
</style>
</head>
<body>

  <a class="back-link" href="index.html"><span aria-hidden="true">★</span> Back to Two Step Collective</a>

  <div class="container">
    <h1>Can I Scoot To This?</h1>
    <p class="subtitle">Type a song and find out if it two-steps.</p>
    <input type="text" id="user-input" placeholder="Type a song name..." />
    <button id="send-btn">Analyze</button>
    <div id="output"></div>
    <a class="community-link" href="community.html">View most searched songs →</a>
  </div>

  <!-- Local-only, gitignored — see js/anthropic-key.example.js -->
  <script src="js/anthropic-key.js"></script>
  <script src="js/howdyAI.js"></script>
</body>
</html>
