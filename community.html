<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Most Searched Songs — Two Step Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;1,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* Same palette + fonts as the main site's css/styles.css, kept local
     here since this page lives outside that stylesheet's reach */
  :root {
    --bg: #f8f3e8;
    --ink: #191919;
    --ink-soft: rgba(25, 25, 25, 0.62);
    --coral: #e16e57;
    --chartreuse: #e2e88c;
    --seafoam: #a3c7c5;
    --blue: #2e72a4;
    --pink: #d66577;
    --orange: #f4a556;
    --serif: 'Bitter', Georgia, serif;
    --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding: 2rem;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--ink);
    color: var(--bg);
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    border: 2px solid var(--ink);
  }
  .back-link span { color: var(--chartreuse); }
  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-style: italic;
    font-size: 1.75rem;
    margin: 1.5rem 0 0.25rem;
  }
  p.intro {
    color: var(--ink-soft);
    max-width: 60ch;
    margin: 0 0 1.5rem;
  }
  #song-list {
    max-width: 560px;
  }
  .song-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: #fffdfa;
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 0.9rem 1.2rem;
    margin-bottom: 0.75rem;
  }
  .song-name {
    font-weight: 700;
    display: block;
  }
  .count {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .verdict {
    flex-shrink: 0;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 0.3rem 0.85rem;
  }
  /* Reuses the site palette rather than literal red/yellow/green */
  .verdict.yes { background: var(--chartreuse); }
  .verdict.maybe { background: var(--orange); }
  .verdict.no { background: var(--coral); }
</style>
</head>
<body>

  <a class="back-link" href="index.html"><span aria-hidden="true">★</span> Back to Two Step Collective</a>

  <h1>Most Searched Songs</h1>
  <p class="intro">Every song looked up on <a href="howdyAI.html">Can I Scoot To This?</a>, ranked by how often people have asked.</p>

  <div id="song-list"></div>

  <script src="js/community.js"></script>
</body>
</html>
